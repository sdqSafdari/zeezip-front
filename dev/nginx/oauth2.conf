 # =================== 2) /oauth2/authorization/google ===================
        location = /oauth2/authorization/google {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSL configuration for upstream
                        proxy_ssl_server_name on;
                        proxy_ssl_name $backend_host;
                        proxy_ssl_verify off;  # Set to 'on' if you want to verify SSL certificate


            # Rewrite redirect_uri in Google redirect URLs
            proxy_redirect ~(.*)redirect_uri=https://zzip.ir/(.*) $1redirect_uri=http://localhost:9000/$2;
        }

        # =================== 3) OAuth2 callback ===================
        location = /login/oauth2/code/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSL configuration for upstream
                                    proxy_ssl_server_name on;
                                    proxy_ssl_name $backend_host;
                                    proxy_ssl_verify off;  # Set to 'on' if you want to verify SSL certificate


            # Rewrite Location header from example.com → localhost:9000
            proxy_redirect ~(.*)https://zzip.ir/(.*) $1http://localhost:9000/$2;
        }
