worker_processes auto;
events { worker_connections 1024; }

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;


    include mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

#    upstream frontend_upstream {
            # Next.js dev server
            # default host will be set to frontend_host
#            server localhost:3000;
#    }

#   upstream backend_upstream {
            # Stage backend
            # for pooling and load balancing
            # resolved at startup time
#            server zzip.ir;
#   }


    server {
        listen 9000;
        server_name localhost;

        set $frontend_host 192.168.8.103:3000;

        set $backend_host zzip.ir;

         # Use the systemd-resolved stub resolver
         resolver 8.8.8.8 1.1.1.1 valid=30s;

        # =================== 1) /bff and /protected API ===================
        location ~ ^/(bff|protected)/{
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSL configuration for upstream
                                    proxy_ssl_server_name on;
                                    proxy_ssl_name $backend_host;
                                    proxy_ssl_verify off;  # Set to 'on' if you want to verify SSL certificate

            # Rewrite Location header from example.com → localhost:9000
            proxy_redirect ~(.*)https://zzip.ir/(.*) $1http://localhost:9000/$2;

            proxy_cookie_path / /;
            client_max_body_size 100m;
        }

        # =================== 4) Frontend ===================
        location / {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect ~(.*)http://.+?/(.*) $1http://localhost:9000/$2;
        }
    }
}
